<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6ede1"/>
      <stop offset="100%" stop-color="#f5f0e6"/>
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557d6d"/>
      <stop offset="100%" stop-color="#3d5c50"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4a3e"/>
      <stop offset="100%" stop-color="#1b2f27"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="20" fill="url(#skyGrad)"/>
  
  <!-- Sun / Warm Light -->
  <circle cx="480" cy="80" r="45" fill="#f5c253" opacity="0.85"/>
  <circle cx="480" cy="80" r="60" fill="#f5c253" opacity="0.25"/>
  
  <!-- Distant Barzok Mountains (کوه‌های کرکس و برزک) -->
  <path d="M 0 220 L 110 130 L 220 200 L 340 110 L 460 190 L 560 120 L 600 150 L 600 320 L 0 320 Z" fill="url(#mountainGrad1)" opacity="0.6"/>
  <path d="M 0 250 L 150 160 L 300 230 L 440 150 L 600 240 L 600 320 L 0 320 Z" fill="url(#mountainGrad2)"/>
  
  <!-- Terraced hills & Walnut/Shatooth trees -->
  <ellipse cx="140" cy="270" rx="90" ry="40" fill="#437059"/>
  <ellipse cx="460" cy="280" rx="120" ry="45" fill="#385e4b"/>
  
  <!-- Traditional Mud-brick Eco-Lodge in valley -->
  <g transform="translate(240, 190)">
    <!-- Base House -->
    <rect x="0" y="30" width="120" height="70" rx="4" fill="#dfbe88"/>
    <!-- Upper Floor (بالاخونه) -->
    <rect x="25" y="0" width="70" height="35" rx="3" fill="#cfad77"/>
    <!-- Traditional Iranian Arch windows & wooden lintels -->
    <path d="M 45 10 C 45 5, 55 5, 55 10 L 55 25 L 45 25 Z" fill="#20362c"/>
    <path d="M 65 10 C 65 5, 75 5, 75 10 L 75 25 L 65 25 Z" fill="#20362c"/>
    <!-- Lower windows & door -->
    <rect x="50" y="55" width="20" height="45" rx="3" fill="#8d4a23"/>
    <rect x="15" y="45" width="22" height="28" rx="2" fill="#20362c"/>
    <rect x="83" y="45" width="22" height="28" rx="2" fill="#20362c"/>
    <!-- Traditional wooden roof beams (چوب‌بری سقف) -->
    <line x1="20" y1="3" x2="100" y2="3" stroke="#704424" stroke-width="4"/>
    <line x1="-5" y1="33" x2="125" y2="33" stroke="#704424" stroke-width="4"/>
  </g>
  
  <!-- Green Sprout & Leaf symbolizing Green Travel (سفر سبز) -->
  <g transform="translate(60, 50)">
    <circle cx="28" cy="28" r="32" fill="#2d4a3e" opacity="0.9"/>
    <path d="M 28 44 C 28 34, 38 24, 42 20 C 42 32, 34 42, 28 44 Z" fill="#69c381"/>
    <path d="M 28 44 C 28 36, 18 28, 14 26 C 16 38, 24 43, 28 44 Z" fill="#a4de99"/>
    <path d="M 28 44 L 28 18" stroke="#f5c253" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <text x="110" y="73" fill="#1b2f27" font-family="sans-serif" font-size="20" font-weight="bold">🌱 همراه با طبیعت پاک برزک</text>
  <text x="110" y="98" fill="#4d6257" font-family="sans-serif" font-size="14">پایداری، احترام به فرهنگ بومی و آرامش کوهستان</text>
</svg>
