<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ghaaliBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ede3"/>
      <stop offset="100%" stop-color="#e3d0bb"/>
    </linearGradient>
    <linearGradient id="carpetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#992b2b"/>
      <stop offset="100%" stop-color="#6e1818"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#ghaaliBg)"/>
  
  <!-- Traditional Wall with Persian Rug (قالی دستباف کاشان) on the wall -->
  <rect x="130" y="25" width="240" height="150" rx="4" fill="url(#carpetRed)" stroke="#d49b29" stroke-width="4"/>
  <!-- Carpet fringes (ریشه قالی) -->
  <line x1="125" y1="20" x2="125" y2="180" stroke="#f1e2c9" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="375" y1="20" x2="375" y2="180" stroke="#f1e2c9" stroke-width="3" stroke-dasharray="3,3"/>
  <!-- Medallion (ترنج مرکزی قالی) -->
  <circle cx="250" cy="100" r="36" fill="#1b3f36" stroke="#d49b29" stroke-width="3"/>
  <polygon points="250,75 265,95 285,100 265,105 250,125 235,105 215,100 235,95" fill="#d49b29"/>
  <!-- Carpet inner border -->
  <rect x="145" y="40" width="210" height="120" fill="none" stroke="#e0c283" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Persian Korsi (کرسی سنتی) with heater & blanket -->
  <g transform="translate(140, 185)">
    <!-- Korsi blanket (لحاف کرسی) -->
    <path d="M 0 65 L 45 15 L 175 15 L 220 65 Z" fill="#882834" stroke="#5a1821" stroke-width="2"/>
    <rect x="40" y="10" width="140" height="12" rx="3" fill="#cf9d40"/>
    <!-- Traditional brass samovar & teacups on Korsi -->
    <ellipse cx="110" cy="16" rx="14" ry="7" fill="#b9822a"/>
    <rect x="105" y="5" width="10" height="10" fill="#cca045"/>
    <circle cx="80" cy="15" r="4" fill="#a83232"/>
    <circle cx="140" cy="15" r="4" fill="#a83232"/>
    <!-- Backrests (پشتی‌های مخمل شاه‌نشین) -->
    <rect x="-25" y="25" width="30" height="40" rx="6" fill="#1d4337"/>
    <rect x="215" y="25" width="30" height="40" rx="6" fill="#1d4337"/>
  </g>
  
  <text x="250" y="300" text-anchor="middle" fill="#38291f" font-family="sans-serif" font-size="18" font-weight="bold">اتاق قالی • اصالت دست‌بافته‌ها و کرسی گرم</text>
</svg>
