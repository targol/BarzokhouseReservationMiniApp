<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="saraBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f2e9"/>
      <stop offset="100%" stop-color="#e8dcce"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#saraBg)"/>
  
  <!-- Grand Hall Arches (پنج‌دری و طاق‌نماهای بزرگ سرا) -->
  <path d="M 30 240 L 30 110 C 30 50, 150 50, 150 110 L 150 240 Z" fill="#efe4d3" stroke="#cca985" stroke-width="2.5"/>
  <path d="M 190 240 L 190 90 C 190 30, 310 30, 310 90 L 310 240 Z" fill="#fcf6ec" stroke="#c58b1f" stroke-width="3"/>
  <path d="M 350 240 L 350 110 C 350 50, 470 50, 470 110 L 470 240 Z" fill="#efe4d3" stroke="#cca985" stroke-width="2.5"/>
  
  <!-- Central Chandelier / Lantern (چراغ آویز سنتی) -->
  <line x1="250" y1="30" x2="250" y2="85" stroke="#946d23" stroke-width="3"/>
  <polygon points="250,85 265,115 250,135 235,115" fill="#e5b03e" opacity="0.9"/>
  <circle cx="250" cy="115" r="8" fill="#fff5d1"/>
  
  <!-- Traditional Floor Bedding Setups (سرویس‌های خواب سنتی شاه‌نشین) -->
  <g transform="translate(60, 200)">
    <!-- Quilt 1 -->
    <rect x="0" y="20" width="90" height="35" rx="5" fill="#a83232"/>
    <rect x="10" y="5" width="70" height="18" rx="8" fill="#f5ede3"/>
    <!-- Quilt 2 (Middle) -->
    <rect x="125" y="15" width="130" height="42" rx="6" fill="#2d5241"/>
    <rect x="145" y="0" width="90" height="20" rx="9" fill="#f5ede3"/>
    <!-- Quilt 3 -->
    <rect x="290" y="20" width="90" height="35" rx="5" fill="#a83232"/>
    <rect x="300" y="5" width="70" height="18" rx="8" fill="#f5ede3"/>
  </g>
  
  <text x="250" y="300" text-anchor="middle" fill="#38291f" font-family="sans-serif" font-size="18" font-weight="bold">اتاق سرا • شاه‌نشین بزرگ خانوادگی و صمیمی</text>
</svg>
