<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="balaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9f3eb"/>
      <stop offset="100%" stop-color="#d6e6d9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#balaBg)"/>
  
  <!-- Balcony / Rooftop Vista of Barzok Mountains -->
  <path d="M 0 160 L 140 90 L 260 140 L 380 80 L 500 130 L 500 240 L 0 240 Z" fill="#5c8774" opacity="0.6"/>
  <path d="M 0 190 L 180 130 L 340 180 L 500 120 L 500 260 L 0 260 Z" fill="#3c6553" opacity="0.8"/>
  
  <!-- Wooden Balcony Railing (نرده‌های چوبی ایوان بالاخونه) -->
  <g transform="translate(0, 180)">
    <!-- Top & bottom rail -->
    <rect x="0" y="30" width="500" height="12" fill="#663e23"/>
    <rect x="0" y="85" width="500" height="15" fill="#52311a"/>
    <!-- Vertical balusters -->
    <g fill="#7a4b2c">
      <rect x="30" y="42" width="10" height="43"/>
      <rect x="80" y="42" width="10" height="43"/>
      <rect x="130" y="42" width="10" height="43"/>
      <rect x="180" y="42" width="10" height="43"/>
      <rect x="230" y="42" width="10" height="43"/>
      <rect x="280" y="42" width="10" height="43"/>
      <rect x="330" y="42" width="10" height="43"/>
      <rect x="380" y="42" width="10" height="43"/>
      <rect x="430" y="42" width="10" height="43"/>
    </g>
  </g>
  
  <!-- Tea Table on Terrace with 2 Chairs -->
  <g transform="translate(200, 195)">
    <ellipse cx="50" cy="18" rx="35" ry="12" fill="#cf9d40"/>
    <line x1="50" y1="18" x2="50" y2="45" stroke="#7a4b2c" stroke-width="5"/>
    <circle cx="40" cy="16" r="4" fill="#a83232"/>
    <circle cx="60" cy="16" r="4" fill="#a83232"/>
  </g>
  
  <text x="250" y="305" text-anchor="middle" fill="#1b3f33" font-family="sans-serif" font-size="18" font-weight="bold">اتاق بالاخونه • ایوان اختصاصی و چشم‌انداز دره و کوهستان</text>
</svg>
