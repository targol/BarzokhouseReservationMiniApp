<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="shatootBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ece1"/>
      <stop offset="100%" stop-color="#e2d3be"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b1d3d"/>
      <stop offset="100%" stop-color="#3d0a1e"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#shatootBg)"/>
  
  <!-- Traditional Plaster Arch Wall (طاقچه گچی) -->
  <path d="M 50 320 L 50 140 C 50 60, 450 60, 450 140 L 450 320 Z" fill="#eee5d8" stroke="#d5c3ab" stroke-width="3"/>
  <path d="M 80 320 L 80 150 C 80 85, 420 85, 420 150 L 420 320 Z" fill="#fcf8f2"/>
  
  <!-- Window overlooking green trees of Barzok -->
  <g transform="translate(190, 70)">
    <rect width="120" height="110" rx="10" fill="#a4c9b3"/>
    <ellipse cx="60" cy="55" rx="50" ry="40" fill="#47735a"/>
    <ellipse cx="30" cy="70" rx="25" ry="25" fill="#305741"/>
    <ellipse cx="90" cy="70" rx="25" ry="25" fill="#305741"/>
    <!-- Window frame wooden grid -->
    <rect width="120" height="110" rx="10" fill="none" stroke="#684227" stroke-width="5"/>
    <line x1="60" y1="0" x2="60" y2="110" stroke="#684227" stroke-width="4"/>
    <line x1="0" y1="55" x2="120" y2="55" stroke="#684227" stroke-width="4"/>
  </g>
  
  <!-- Traditional Wooden Bed with Persian Pillows -->
  <g transform="translate(110, 190)">
    <!-- Wooden Bed Frame -->
    <rect x="0" y="55" width="280" height="45" rx="5" fill="#754727"/>
    <rect x="-10" y="20" width="15" height="85" rx="3" fill="#5c3419"/>
    <rect x="275" y="20" width="15" height="85" rx="3" fill="#5c3419"/>
    
    <!-- Mattress & Quilt (لحاف دست‌دوز سنتی) -->
    <rect x="5" y="40" width="270" height="30" rx="6" fill="#b94756"/>
    <!-- Traditional Iranian pattern on quilt -->
    <line x1="30" y1="40" x2="250" y2="40" stroke="#dfa344" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="30" y1="55" x2="250" y2="55" stroke="#dfa344" stroke-width="3" stroke-dasharray="8,6"/>
    
    <!-- Bolsters (پشتی و متکای سنتی) -->
    <rect x="20" y="24" width="70" height="22" rx="10" fill="#2d5241"/>
    <rect x="100" y="24" width="70" height="22" rx="10" fill="#2d5241"/>
  </g>
  
  <!-- Niche (طاقچه) with Kermani pottery & Shatoot bowl -->
  <rect x="90" y="110" width="60" height="10" rx="2" fill="#d5c3ab"/>
  <ellipse cx="120" cy="104" rx="14" ry="8" fill="#2a667f"/>
  
  <!-- Shatoot Berry Badge -->
  <g transform="translate(415, 35)">
    <circle cx="0" cy="0" r="22" fill="url(#berryGrad)"/>
    <circle cx="-5" cy="-5" r="5" fill="#9b2d5a"/>
    <circle cx="4" cy="-3" r="4.5" fill="#9b2d5a"/>
    <circle cx="-2" cy="4" r="5" fill="#9b2d5a"/>
    <circle cx="5" cy="5" r="4" fill="#9b2d5a"/>
    <path d="M 0 -22 C -4 -28, 2 -32, 6 -27 C 8 -24, 4 -22, 0 -22 Z" fill="#518c43"/>
  </g>
  
  <text x="250" y="300" text-anchor="middle" fill="#42342b" font-family="sans-serif" font-size="18" font-weight="bold">اتاق شاتوت • مشرف به باغ‌های توت برزک</text>
</svg>
